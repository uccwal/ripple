# 프론트엔드를 GitHub Pages에 배포한다 (https://uccwal.github.io/ripple/).
# 백엔드(API)는 별도 서버가 필요하다 → render.yaml 참고. 저장소 Settings → Pages → Source: GitHub Actions,
# Settings → Secrets and variables → Actions → Variables 에 API_BASE_URL (예: https://ripple-api.onrender.com) 등록.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /ripple/
          VITE_API_BASE: ${{ vars.API_BASE_URL }}
      # SPA 라우팅: Pages는 404.html 을 돌려주므로 index.html 을 복사한다
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
