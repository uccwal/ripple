# Render 블루프린트: 백엔드 API + PostgreSQL (무료 플랜으로 시작 가능).
# Render 대시보드 → New → Blueprint → 이 저장소 선택 → 환경 변수(ANTHROPIC_API_KEY 등) 입력.
# 배포 후 URL(예: https://ripple-api.onrender.com)을 GitHub 변수 API_BASE_URL 에 넣으면 Pages 프론트엔드가 이 API를 쓴다.
services:
  - type: web
    name: ripple-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ripple-db
          property: connectionString
      - key: SEED_ARGS
        value: --synthetic
      - key: CORS_ORIGINS
        value: https://uccwal.github.io
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL_DEFAULT
        value: claude-haiku-5-5
      - key: MODEL_IMPACT_MAPPER
        value: claude-haiku-5-5
      - key: FRED_API_KEY
        sync: false
      - key: ECOS_API_KEY
        sync: false
      - key: DATA_GO_KR_API_KEY
        sync: false

databases:
  - name: ripple-db
    plan: free
    databaseName: ripple
    user: ripple
